name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.17', 24]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # The lockfile is generated by npm 11. npm 10 (bundled with Node 22)
      # resolves this tree differently and rejects it, so pin npm rather than
      # inherit whatever each Node release happens to ship.
      - run: npm i -g npm@11

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build & validate package
        # `prepack` runs tsc + publint, the same gate `npm publish` uses.
        run: npm run prepack
